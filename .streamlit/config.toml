# Giao diện Dashboard Task 3 (Streamlit tự đọc file này khi chạy từ thư mục gốc dự án)
[theme]
base = "dark"
primaryColor = "#7C6CF2"
backgroundColor = "#0A0D14"
secondaryBackgroundColor = "#11151F"
textColor = "#ECEEF3"
font = "sans serif"

[client]
toolbarMode = "viewer"

[browser]
